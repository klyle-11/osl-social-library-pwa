; OSL radio link firmware (gate seven). Two roles from one code base:
;   modem      - plugged into the Pi by USB; frames, sends, receives, hands over. Stores nothing.
;   droppoint  - out in the neighbourhood; Wi-Fi + HTTPS /sync for phones, stores ops in flash,
;                forwards them to the archive by radio.
;
;   pio run -e modem-heltec-v3 -t upload
;   pio run -e droppoint-heltec-v3 -t uploadfs   (app files + TLS cert, see README)
;   pio run -e droppoint-heltec-v3 -t upload
;
; Board: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) by default. LilyGO T3-S3 (SX1262)
; environments are below; other SX1262 boards need their pins in include/config.h.

[platformio]
default_envs = modem-heltec-v3, droppoint-heltec-v3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
    bblanchon/ArduinoJson@^7.2.1
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[heltec]
; USB goes through a CP2102 serial chip: the Pi sees /dev/ttyUSB0
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DBOARD_HELTEC_V3

[lilygo]
; T3-S3 has 4 MB flash: generic S3 board definition with a layout that leaves room for the app
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
; native USB: the Pi sees /dev/ttyACM0
build_flags = ${env.build_flags} -DBOARD_LILYGO_T3S3 -DARDUINO_USB_CDC_ON_BOOT=1

[modem]
build_src_filter = +<common/> +<modem/>

[droppoint]
build_src_filter = +<common/> +<droppoint/>
board_build.filesystem = littlefs

[env:modem-heltec-v3]
extends = heltec, modem
build_flags = ${heltec.build_flags} -DROLE_MODEM

[env:droppoint-heltec-v3]
extends = heltec, droppoint
board_build.partitions = default_8MB.csv
build_flags = ${heltec.build_flags} -DROLE_DROPPOINT

[env:modem-lilygo-t3s3]
extends = lilygo, modem
build_flags = ${lilygo.build_flags} -DROLE_MODEM

[env:droppoint-lilygo-t3s3]
extends = lilygo, droppoint
build_flags = ${lilygo.build_flags} -DROLE_DROPPOINT
